name = "minna-no-douga-renew"
main = "src/index.js"
compatibility_date = "2024-12-01"

# Daily reminder at 09:00 UTC = 18:00 JST
[triggers]
crons = ["0 9 * * *"]

[vars]
GITHUB_REPO     = "rikxsa/minna-no-douga"
GITHUB_BRANCH   = "main"
GITHUB_WORKFLOW = "update.yml"
SITE_ORIGIN     = "https://rikxsa.github.io/minna-no-douga"
WORKER_ORIGIN   = "https://minna-no-douga-renew.rikxsa.workers.dev"
VAPID_SUBJECT   = "mailto:sakuramaru908@gmail.com"

# id (lowercase) -> Google account email
# あとで友人を追加するときはここに行を追加して再デプロイ。
USER_EMAIL_MAP = """
{
  "sakuramaru908@gmail.com": "riki"
}
"""

# Mirror of data/users.json so the Worker can render display names.
USERS_JSON = """
[
  { "id": "riki", "name": "リキ" }
]
"""

# Secrets (set via `wrangler secret put <name>`):
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   GITHUB_TOKEN          fine-grained PAT (Actions/Secrets/Contents/Workflows write)
#   COOKIE_SECRET         any long random string (e.g. `openssl rand -hex 32`)
#   VAPID_PUBLIC_KEY      generate with `npx web-push generate-vapid-keys` (publicKey, base64url)
#   VAPID_PRIVATE_KEY     same command (privateKey, base64url)
