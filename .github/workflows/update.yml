name: Update liked videos

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-likes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch liked videos
        env:
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # One env line per user. The variable name must be
          # USER_<ID>_REFRESH_TOKEN where <ID> matches data/users.json
          # (upper-cased). Add a line when a friend joins; delete it
          # when they leave.
          USER_RIKI_REFRESH_TOKEN: ${{ secrets.USER_RIKI_REFRESH_TOKEN }}
        run: python scripts/fetch_youtube.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: update liked videos ($(date -u +%Y-%m-%d))"
          # The Worker may have committed data/status.json since checkout —
          # rebase onto whatever's on the remote before pushing.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push failed, rebasing and retrying ($i)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "push retries exhausted"
          exit 1
