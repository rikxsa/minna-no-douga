<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#fafbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0e14" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="仲間うちで YouTube のお気に入りを共有するプライベートタイムライン" />

    <title>みんなの動画</title>

    <link rel="icon" type="image/webp" href="icon.webp" />
    <link rel="apple-touch-icon" sizes="180x180" href="icon.webp" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="みんなの動画" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Color schemes -->
    <meta name="color-scheme" content="light dark" />

    <meta property="og:title" content="みんなの動画" />
    <meta property="og:description" content="仲間うちで YouTube のお気に入りを共有するプライベートタイムライン" />
    <meta property="og:image" content="icon.webp" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="icon.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Zen+Kaku+Gothic+Antique:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") || "light";
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body data-state="boot">
    <!-- Aurora background -->
    <div class="bg-aurora" aria-hidden="true">
      <span class="aurora aurora-a"></span>
      <span class="aurora aurora-b"></span>
      <span class="aurora aurora-c"></span>
    </div>

    <!-- Boot loader -->
    <div class="boot" id="boot" aria-hidden="true">
      <span class="boot-dot"></span>
    </div>

    <!-- ============== PASSCODE GATE ============== -->
    <div class="gate hidden" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
      <div class="gate-card glass-panel">
        <div class="gate-icon" aria-hidden="true">
          <img src="icon.webp" alt="" />
        </div>
        <p class="gate-title" id="gateTitle">合言葉をどうぞ</p>
        <input
          class="gate-input" id="gateInput"
          type="text" inputmode="text"
          autocomplete="off" autocapitalize="off" autocorrect="off"
          spellcheck="false"
          placeholder="…"
          aria-label="合言葉"
        />
        <button class="gate-btn" id="gateBtn" type="button">入る</button>
        <p class="gate-hint">ヒント: 犬の名前 (英) / 2年に1度のあれ (英) / 4桁の暗証番号</p>
      </div>
    </div>

    <div class="layout" id="app" aria-hidden="true">
      <!-- ============== SIDE NAV (PC) ============== -->
      <aside class="sidenav glass-panel" id="sidenav" data-fade="1">
        <div class="nav-group nav-scroll" id="navFilters" aria-label="フィルター"></div>

        <div class="nav-spacer"></div>

        <div class="nav-group">
          <button class="nav-item" id="channelsBtn" type="button" aria-label="チャンネル別">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="6" width="18" height="13" rx="2"/>
                <path d="M8 3l4 3 4-3"/>
              </svg>
            </span>
            <span class="nav-label">チャンネル</span>
          </button>
          <button class="nav-item" id="diceBtn" type="button" aria-label="ランダム再生">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
                stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
                <rect x="3.5" y="3.5" width="17" height="17" rx="4" ry="4" />
                <circle cx="8.5" cy="8.5" r="1.1" fill="currentColor" />
                <circle cx="15.5" cy="8.5" r="1.1" fill="currentColor" />
                <circle cx="12" cy="12" r="1.1" fill="currentColor" />
                <circle cx="8.5" cy="15.5" r="1.1" fill="currentColor" />
                <circle cx="15.5" cy="15.5" r="1.1" fill="currentColor" />
              </svg>
            </span>
            <span class="nav-label">ランダム</span>
          </button>
          <button class="nav-item" id="sortBtn" type="button" aria-label="並び替え">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 4v16M3 8l4-4 4 4" />
                <path d="M17 20V4M13 16l4 4 4-4" />
              </svg>
            </span>
            <span class="nav-label" id="sortLabel">新着順</span>
          </button>
          <button class="nav-item hidden" id="pushBtn" type="button" aria-label="通知をオン">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9a6 6 0 0 1 12 0v5l1.5 2.5h-15L6 14V9z"/>
                <path d="M10 19a2 2 0 0 0 4 0"/>
              </svg>
            </span>
            <span class="nav-label" id="pushLabel">通知</span>
          </button>
          <button class="nav-item" id="themeBtn" type="button" aria-label="テーマ切り替え">
            <span class="nav-icon">
              <svg class="theme-icon-light" viewBox="0 0 24 24" width="22" height="22"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4" />
              </svg>
              <svg class="theme-icon-dark" viewBox="0 0 24 24" width="22" height="22"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
                <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
              </svg>
            </span>
            <span class="nav-label">テーマ</span>
          </button>
        </div>
      </aside>

      <!-- ============== TOP STATUS BAR ============== -->
      <header class="top-status-bar" data-fade="2">
        <a class="brand-mark" id="brandMark" href="#" aria-label="ホームに戻る">みんなの動画</a>

        <div class="status-widget glass-panel" id="statusWidget" aria-live="polite">
          <span class="status-icon">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
              stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3.5 2" />
            </svg>
          </span>
          <span class="status-text" id="statusText">—</span>
        </div>

        <div class="top-right">
          <div class="clock" id="clock">--:--</div>
          <button class="account glass-panel" id="accountBtn" type="button" aria-label="アカウント">
            <span class="account-avatar" id="accountAvatar"></span>
            <span class="account-label" id="accountLabel">—</span>
            <span class="account-dot" id="accountDot" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <!-- ============== MAIN ============== -->
      <main class="main" id="main">
        <div class="banners" id="banners" aria-live="polite"></div>

        <!-- Inline player (mobile only — sits above the grid so cards still scroll) -->
        <div class="inline-player hidden" id="inlinePlayer" aria-hidden="true">
          <div class="ip-frame">
            <div id="ipPlayer"></div>
          </div>
          <div class="ip-bar">
            <div class="ip-meta" id="ipMeta"></div>
            <div class="ip-controls">
              <div class="speed-row" id="ipSpeed" role="group" aria-label="再生速度">
                <button data-rate="0.5" type="button">0.5×</button>
                <button data-rate="1" type="button" class="active">1×</button>
                <button data-rate="1.5" type="button">1.5×</button>
                <button data-rate="2" type="button">2×</button>
              </div>
              <button class="ip-fs" id="ipFsBtn" type="button" aria-label="全画面">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
                </svg>
              </button>
              <a class="ip-yt" id="ipYtBtn" target="_blank" rel="noopener noreferrer" aria-label="YouTubeで開く">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M7 17L17 7"/><path d="M8 7h9v9"/>
                </svg>
              </a>
              <button class="ip-close" id="ipCloseBtn" type="button" aria-label="閉じる">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <path d="M6 6l12 12M18 6L6 18"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="search-bar" data-fade="3">
          <span class="search-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/>
              <path d="M16 16l5 5"/>
            </svg>
          </span>
          <input
            class="search-input" id="searchInput" type="search"
            placeholder="動画を検索... Music Videoなど"
            autocomplete="off" autocapitalize="off" autocorrect="off"
            spellcheck="false" inputmode="search"
            aria-label="動画を検索"
          />
          <button class="search-clear hidden" id="searchClearBtn" type="button" aria-label="クリア">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </button>
          <span class="search-count" id="searchCount" aria-live="polite"></span>
        </div>

        <div class="resurface hidden" id="resurface" data-fade="3"></div>

        <div class="card-grid-wrap" data-fade="3">
          <div class="card-grid" id="grid" role="listbox" tabindex="-1"></div>
        </div>

        <p class="empty hidden" id="empty">まだ動画がありません — 明日また覗いてみて。</p>
      </main>

      <!-- ============== BOTTOM HINT BAR (PC only) ============== -->
      <footer class="bottom-hint-bar" data-fade="4">
        <span class="hint">
          <span class="kbd"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></span>
          <span class="kbd"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></span>
          <span class="hint-label">移動</span>
        </span>
        <span class="hint">
          <span class="kbd">↵</span>
          <span class="hint-label">再生</span>
        </span>
        <span class="hint">
          <span class="kbd">L</span>
          <span class="hint-label">ランダム</span>
        </span>
        <span class="hint">
          <span class="kbd">S</span>
          <span class="hint-label">並び替え</span>
        </span>
        <span class="hint">
          <span class="kbd">T</span>
          <span class="hint-label">テーマ</span>
        </span>
        <a class="hint hint-link" href="about.html">
          <span class="hint-label">このサイトについて</span>
        </a>
        <span class="hint hint-updated" id="updated"></span>
      </footer>

      <!-- ============== MOBILE BOTTOM NAV ============== -->
      <nav class="mobile-nav" id="mobileNav" aria-label="メニュー">
        <button class="mob-tab active" id="mobTimelineBtn" type="button">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
            stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>
          </svg>
          <span>タイムライン</span>
        </button>
        <button class="mob-tab" id="mobFilterBtn" type="button">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
            stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h16M7 12h10M10 18h4"/>
          </svg>
          <span>フィルター</span>
        </button>
        <button class="mob-tab" id="mobDiceBtn" type="button">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
            stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <rect x="3.5" y="3.5" width="17" height="17" rx="4" ry="4" />
            <circle cx="8.5" cy="8.5" r="1.1" fill="currentColor" />
            <circle cx="15.5" cy="8.5" r="1.1" fill="currentColor" />
            <circle cx="12" cy="12" r="1.1" fill="currentColor" />
            <circle cx="8.5" cy="15.5" r="1.1" fill="currentColor" />
            <circle cx="15.5" cy="15.5" r="1.1" fill="currentColor" />
          </svg>
          <span>ランダム</span>
        </button>
        <button class="mob-tab" id="mobMoreBtn" type="button">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
            stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="12" r="1.4" fill="currentColor"/>
            <circle cx="12" cy="12" r="1.4" fill="currentColor"/>
            <circle cx="18" cy="12" r="1.4" fill="currentColor"/>
          </svg>
          <span>その他</span>
        </button>
      </nav>
    </div>

    <!-- ============== FILTER SHEET (mobile) ============== -->
    <div class="sheet-root hidden" id="filterSheetRoot" role="dialog" aria-modal="true" aria-labelledby="filterSheetTitle">
      <div class="sheet-backdrop" id="filterSheetBackdrop"></div>
      <div class="sheet glass-panel" id="filterSheet">
        <div class="sheet-grip" aria-hidden="true"></div>
        <h3 class="sheet-title" id="filterSheetTitle">誰の動画を見る?</h3>
        <div class="sheet-options" id="filterSheetOptions"></div>
      </div>
    </div>

    <!-- ============== CHANNEL SHEET ============== -->
    <div class="sheet-root hidden" id="channelSheetRoot" role="dialog" aria-modal="true" aria-labelledby="channelSheetTitle">
      <div class="sheet-backdrop" id="channelSheetBackdrop"></div>
      <div class="sheet glass-panel">
        <div class="sheet-grip" aria-hidden="true"></div>
        <h3 class="sheet-title" id="channelSheetTitle">チャンネル別</h3>
        <button class="toggle-row" id="minorRowBtn" type="button" style="text-align:left">
          <div>
            <div class="toggle-label">マイナーな動画のみ</div>
            <div class="toggle-hint">再生回数 10万未満の動画だけに絞り込みます</div>
          </div>
          <span class="toggle" id="minorToggle" role="switch" aria-checked="false">
            <span class="toggle-thumb"></span>
          </span>
        </button>
        <div class="sheet-options" id="channelSheetOptions" style="margin-top:12px"></div>
      </div>
    </div>

    <!-- ============== MORE SHEET (mobile) ============== -->
    <div class="sheet-root hidden" id="moreSheetRoot" role="dialog" aria-modal="true">
      <div class="sheet-backdrop" id="moreSheetBackdrop"></div>
      <div class="sheet glass-panel">
        <div class="sheet-grip" aria-hidden="true"></div>
        <h3 class="sheet-title">その他</h3>
        <div class="sheet-list">
          <button class="sheet-row" id="moreSortBtn" type="button">
            <span class="sheet-row-icon">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 4v16M3 8l4-4 4 4"/><path d="M17 20V4M13 16l4 4 4-4"/>
              </svg>
            </span>
            <span class="sheet-row-label">並び替え</span>
            <span class="sheet-row-aux" id="moreSortAux">新着順</span>
          </button>
          <button class="sheet-row" id="moreThemeBtn" type="button">
            <span class="sheet-row-icon">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                <circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>
              </svg>
            </span>
            <span class="sheet-row-label">テーマ</span>
            <span class="sheet-row-aux" id="moreThemeAux">ライト</span>
          </button>
          <button class="sheet-row hidden" id="morePushBtn" type="button">
            <span class="sheet-row-icon">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9a6 6 0 0 1 12 0v5l1.5 2.5h-15L6 14V9z"/><path d="M10 19a2 2 0 0 0 4 0"/>
              </svg>
            </span>
            <span class="sheet-row-label">通知</span>
            <span class="sheet-row-aux" id="morePushAux">オフ</span>
          </button>
          <a class="sheet-row" href="about.html">
            <span class="sheet-row-icon">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/><path d="M12 8v.01"/><path d="M11 12h1v5h1"/>
              </svg>
            </span>
            <span class="sheet-row-label">このサイトについて</span>
          </a>
        </div>
      </div>
    </div>

    <!-- ============== MAIN MODAL ============== -->
    <div class="modal-root hidden" id="modalRoot" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-backdrop" id="modalBackdrop"></div>
      <div class="modal glass-panel" id="modal" tabindex="-1">
        <div class="modal-icon" id="modalIcon" aria-hidden="true"></div>
        <h2 class="modal-title" id="modalTitle"></h2>
        <p class="modal-body" id="modalBody"></p>

        <div class="choices hidden" id="choices"></div>
        <div class="avatar-picker hidden" id="avatarPicker"></div>

        <div class="name-edit hidden" id="nameEdit">
          <label for="nameInput" class="name-label">表示名 <span class="name-hint">(4文字まで)</span></label>
          <div class="name-row">
            <input id="nameInput" type="text" maxlength="8" autocomplete="off" />
            <button class="btn-pill" id="nameSaveBtn" type="button">保存</button>
          </div>
          <p class="name-error hidden" id="nameError"></p>

          <button class="row-btn" id="changeAvatarBtn" type="button">
            <span class="row-btn-avatar" id="currentAvatarPreview"></span>
            <span class="row-btn-label">アイコンを変える</span>
            <span class="row-btn-chev">→</span>
          </button>

          <div class="toggle-row locked" id="toggleRow">
            <div>
              <div class="toggle-label" id="discloseModeLabel">オープンモード</div>
              <div class="toggle-hint" id="toggleHint">あなたがいいねしたことが共有される代わりに、誰がいいねした動画かを知ることができます。</div>
              <div class="toggle-locked-note">変更したい場合は管理人にご連絡ください</div>
            </div>
            <button class="toggle" id="discloseToggle" role="switch" aria-checked="true" type="button" aria-label="現在のモード">
              <span class="toggle-thumb"></span>
            </button>
          </div>
        </div>

        <div class="modal-actions" id="modalActions">
          <button class="btn-secondary hidden" id="modalSkip" type="button">あとで</button>
          <button class="btn-primary" id="modalAction" type="button">
            <svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true">
              <path d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.49h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z" fill="#4285F4"/>
              <path d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z" fill="#34A853"/>
              <path d="M3.97 10.71A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.29-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3.01-2.33z" fill="#FBBC05"/>
              <path d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 9 0 9 9 0 0 0 .96 4.96l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z" fill="#EA4335"/>
            </svg>
            <span id="modalActionLabel">Continue with Google</span>
          </button>
        </div>
        <p class="modal-foot hidden" id="modalFoot"></p>
      </div>
    </div>

    <!-- ============== VIDEO PLAYER MODAL (PC) ============== -->
    <div class="rmodal-root hidden" id="rmRoot" role="dialog" aria-modal="true" aria-labelledby="rmTitle">
      <div class="rmodal-backdrop" id="rmBackdrop"></div>
      <div class="rmodal glass-panel">
        <button class="rmodal-close" id="rmCloseBtn" type="button" aria-label="閉じる">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>

        <div class="rmodal-content" id="rmContent">
          <div class="rm-frame">
            <div id="rmPlayer"></div>
          </div>
          <div class="rm-meta">
            <p class="rm-eyebrow hidden" id="rmEyebrow">きょうの一本</p>
            <h3 class="rm-title" id="rmTitle">—</h3>
            <p class="rm-channel" id="rmChannel"></p>
            <div class="rm-likedby" id="rmLikedby"></div>
          </div>
        </div>

        <div class="rmodal-actions">
          <div class="speed-row" id="rmSpeed" role="group" aria-label="再生速度">
            <button data-rate="0.5" type="button">0.5×</button>
            <button data-rate="1" type="button" class="active">1×</button>
            <button data-rate="1.5" type="button">1.5×</button>
            <button data-rate="2" type="button">2×</button>
          </div>
          <button class="rm-cc" id="rmCcBtn" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="6" width="18" height="12" rx="2"/>
              <path d="M8 11h2M14 11h2M8 14h4"/>
            </svg>
            <span>字幕</span>
          </button>
          <button class="rm-dice hidden" id="rmDice" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
              stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
              <rect x="3.5" y="3.5" width="17" height="17" rx="4" />
              <circle cx="8.5" cy="8.5" r="1.1" fill="currentColor"/>
              <circle cx="15.5" cy="8.5" r="1.1" fill="currentColor"/>
              <circle cx="12" cy="12" r="1.1" fill="currentColor"/>
              <circle cx="8.5" cy="15.5" r="1.1" fill="currentColor"/>
              <circle cx="15.5" cy="15.5" r="1.1" fill="currentColor"/>
            </svg>
            <span>もう1回</span>
          </button>
          <a class="rm-yt" id="rmOpen" target="_blank" rel="noopener noreferrer" aria-label="YouTubeで開く">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 17L17 7"/><path d="M8 7h9v9"/>
            </svg>
          </a>
        </div>
      </div>
    </div>

    <div class="toast hidden" id="toast" role="status" aria-live="polite">
      <span class="toast-icon">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.5l4 4L19 7" />
        </svg>
      </span>
      <span class="toast-text" id="toastText"></span>
    </div>

    <script src="script.js"></script>
  </body>
</html>
